name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk AnkiStreak.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AnkiStreak-apk
          path: AnkiStreak.apk

      # Puts the APK on the repo's Releases page, easy to download on your phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Anki Streak (build ${{ github.run_number }})
          files: AnkiStreak.apk
          make_latest: true
